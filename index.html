<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101318" />
    <meta name="description" content="Jabr CLI — a simple command interface for your application." />
    <title>Jabr CLI</title>
    <link rel="stylesheet" href="/src/interactive/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script>
      window.MathJax = {
        startup: { typeset: false },
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]]
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-chtml.js"></script>
  </head>
  <body>
    <main class="terminal-shell" aria-label="Jabr CLI terminal">
      <header class="terminal-header">
        <div class="window-controls" aria-hidden="true">
          <span class="control control-close"></span>
          <span class="control control-minimize"></span>
          <span class="control control-maximize"></span>
        </div>
        <div class="terminal-title">Jabr CLI <span>v0.1.0</span></div>
        <div class="terminal-header__actions">
          <button id="load-script" class="script-load-button" type="button">Load .jabr</button>
          <input id="script-file" type="file" accept=".jabr,text/plain" hidden />
        </div>
      </header>
      <section id="terminal-output" class="terminal-output" aria-live="polite" aria-label="Terminal output"></section>
      <form id="terminal-form" class="terminal-prompt" autocomplete="off">
        <label class="prompt-label" for="terminal-input">guest@jabr:~$</label>
        <input id="terminal-input" class="terminal-input" type="text"
          spellcheck="false" autocapitalize="off" autocomplete="off"
          aria-label="Enter a command" autofocus />
      </form>
      <footer class="terminal-footer">
        <span>Jabr CLI · Application command interface</span>
        <span><kbd>↑</kbd> <kbd>↓</kbd> history · <kbd>Ctrl</kbd>+<kbd>L</kbd> clear · <kbd>;</kbd> sequence · <kbd>&amp;&amp;</kbd> on success</span>
      </footer>
    </main>
    <script type="module" src="/src/interactive/main.ts"></script>
  </body>
</html>
