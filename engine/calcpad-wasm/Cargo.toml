[package]
name = "jabr-calcpad-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Jabr WebAssembly bindings for its vendored Calcpad core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calcpad-core = { package = "jabr-calcpad-core", path = "../calcpad-core" }
wasm-bindgen = "=0.2.122"
serde_json = "1"
