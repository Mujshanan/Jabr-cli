name: Test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz \
            --output /tmp/wasm-pack.tar.gz
          echo "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.34.5
          run_install: false
      - name: Install JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Run JavaScript dependency audit
        run: pnpm audit --audit-level=low
      - name: Run Rust tests
        run: |
          cargo test --locked --manifest-path rust/mathlex-bridge/Cargo.toml
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked
      - name: Run Rust dependency audit
        run: cargo audit --file rust/mathlex-bridge/Cargo.lock
      - name: Run TypeScript tests
        run: pnpm test
      - name: Build browser application
        run: pnpm build
