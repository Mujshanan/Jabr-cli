name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Run JavaScript dependency audit
        run: pnpm audit --audit-level=high
      - name: Run Rust tests
        run: |
          if [ -f rust/mathlex-bridge/Cargo.lock ]; then
            cargo test --locked --manifest-path rust/mathlex-bridge/Cargo.toml
          else
            cargo test --manifest-path rust/mathlex-bridge/Cargo.toml
          fi
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked
      - name: Run Rust dependency audit
        run: cargo audit --file rust/mathlex-bridge/Cargo.lock
      - name: Run TypeScript tests
        run: pnpm test
      - name: Build browser application
        run: pnpm build
