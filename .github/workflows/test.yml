name: Test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-cli:
    name: CivilKit native CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and smoke-test the native CLI
        run: node scripts/build-native.mjs

  rust-tests:
    name: Rust engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the CivilKit calculation engine
        run: cargo test --locked --manifest-path vendor/civilkit-calcs/Cargo.toml -p civilkit-calcs-engine
      - name: Test the Jabr Mathlex compatibility bridge
        run: cargo test --locked --manifest-path rust/mathlex-bridge/Cargo.toml

  javascript:
    name: WebAssembly and Vite (${{ matrix.manager }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [bun, npm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz \
            --output /tmp/wasm-pack.tar.gz
          echo "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        if: matrix.manager == 'bun'
      - name: Install dependencies with Bun
        if: matrix.manager == 'bun'
        run: bun install --frozen-lockfile
      - name: Install dependencies with npm
        if: matrix.manager == 'npm'
        run: npm ci
      - name: Run npm dependency audit
        if: matrix.manager == 'npm'
        run: npm audit --audit-level=low
      - name: Run TypeScript tests with Bun
        if: matrix.manager == 'bun'
        run: bun run test
      - name: Run TypeScript tests with npm
        if: matrix.manager == 'npm'
        run: npm test
      - name: Build native CLI, WebAssembly engines and Vite pages with Bun
        if: matrix.manager == 'bun'
        run: bun run build:bun
      - name: Build native CLI, WebAssembly engines and Vite pages with npm
        if: matrix.manager == 'npm'
        run: npm run build

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked
      - name: Audit CivilKit dependencies
        run: cargo audit --file vendor/civilkit-calcs/Cargo.lock
      - name: Audit Mathlex bridge dependencies
        run: cargo audit --file rust/mathlex-bridge/Cargo.lock
