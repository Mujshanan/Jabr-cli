name: Generate dependency lockfiles

on:
  push:
    branches:
      - feat/mathlex-ast-renderer

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check whether lockfiles are missing
        id: lockfiles
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f rust/mathlex-bridge/Cargo.lock ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.lockfiles.outputs.missing == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Set up pnpm
        if: steps.lockfiles.outputs.missing == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Rust
        if: steps.lockfiles.outputs.missing == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        if: steps.lockfiles.outputs.missing == 'true'
        run: cargo install wasm-pack --version 0.15.1 --locked
      - name: Generate lockfiles
        if: steps.lockfiles.outputs.missing == 'true'
        run: |
          pnpm install --lockfile-only
          cargo generate-lockfile --manifest-path rust/mathlex-bridge/Cargo.toml
      - name: Verify frozen JavaScript dependency resolution
        if: steps.lockfiles.outputs.missing == 'true'
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        if: steps.lockfiles.outputs.missing == 'true'
        run: pnpm audit --audit-level=high
      - name: Run Rust tests with the generated lockfile
        if: steps.lockfiles.outputs.missing == 'true'
        run: cargo test --locked --manifest-path rust/mathlex-bridge/Cargo.toml
      - name: Install Rust dependency auditor
        if: steps.lockfiles.outputs.missing == 'true'
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        if: steps.lockfiles.outputs.missing == 'true'
        run: cargo audit --file rust/mathlex-bridge/Cargo.lock
      - name: Run TypeScript tests
        if: steps.lockfiles.outputs.missing == 'true'
        run: pnpm test
      - name: Build browser application
        if: steps.lockfiles.outputs.missing == 'true'
        run: pnpm build
      - name: Commit generated lockfiles
        if: steps.lockfiles.outputs.missing == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml rust/mathlex-bridge/Cargo.lock
          git commit -m "chore: add reproducible dependency lockfiles"
          git push origin "${GITHUB_REF_NAME}"
